[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antifraud-research-platform"
version = "0.1.0"
description = "Versioned temporal fraud rules for fictitious transactions and identity links"
requires-python = ">=3.10"

[project.scripts]
antifraud-demo = "antifraud.examples.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
